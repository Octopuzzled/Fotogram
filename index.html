<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>

    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <img src="./assets/svg/logo.svg" alt="">
    </header>
    
    <main>
        <h1>Your personal photo album</h1>
        <section id="photos" class="photo-section">
            <img id="1" class="img-thumbnail" src="./assets/img/city.jpg" alt="Photo of a city by night">
            <img id="2" class="img-thumbnail" src="./assets/img/clouds.png" alt="Photo of dark clouds">
        </section>
    </main>

    <footer>
        <img src="./assets/svg/da-logo.svg" alt="Logo of Developer Academy">
        <p class="copyright-text">© 2023 Developer Akademie GmbH</p>
    </footer>
</body>
</html>
