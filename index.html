<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fotogram</title>

        <link rel="stylesheet" href="style.css" />
        <script src="./templates.js" defer></script>
        <script src="./script.js" defer></script>
    </head>
    <body onload="init()">
        <header class="site-header">
            <img src="./assets/svg/logo.svg" alt="" />
        </header>

        <main>
            <h1>Your personal photo album</h1>
            <section id="photos" class="photo-section">
                <!-- Content generated by script.js -->
                <!-- <button class="gallery-btn" onclick="openDialog(${index})">
                <img id="${index}" class="img-thumbnail" src="./assets/img/${img.name}" alt="${img.alt}">
                </button> 
                -->
            </section>

            <!-- Dialog opens wehen thumbnail picture is clicked -->
            <dialog
                id="imgDialog"
                class="img-dialog"
                onclick="closeOnBackdrop(event)"
            >
                <header id="dialogHeader" class="dialog-header">
                    <h2 id="dialogTitle"></h2>
                    <button
                        class="dialog-close-btn"
                        onclick="closeDialog()"
                        aria-label="Schließen"
                    >
                        ×
                    </button>
                </header>
                <section id="dialogSection" class="dialog-section">
                    <img id="dialogImg" src="" alt="" />
                </section>
                <footer id="dialogFooter" class="dialog-footer">
                    <button
                        class="dialog-nav-btn"
                        onclick="backwards()"
                        aria-label="Vorheriges Bild"
                    >
                        <img src="./assets/svg/left.svg" alt="" />
                    </button>
                    <p id="dialogCounter" class="dialog-counter"></p>
                    <button
                        class="dialog-nav-btn"
                        onclick="forwards()"
                        aria-label="Nächstes Bild"
                    >
                        <img src="./assets/svg/right.svg" alt="" />
                    </button>
                </footer>
            </dialog>
        </main>

        <footer class="site-footer">
            <img
                src="./assets/svg/da-logo.svg"
                alt="Logo of Developer Academy"
            />
            <p class="copyright-text">© 2023 Developer Akademie GmbH</p>
        </footer>
    </body>
</html>
